<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QR Code 掃描器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; flex-direction:column; height:100dvh; overflow:hidden; font-family:'PingFang TC','Microsoft JhengHei',sans-serif; }
#vw { flex:1; position:relative; overflow:hidden; }
#video { width:100%; height:100%; object-fit:cover; display:block; }
#overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
#frame { width:260px; height:260px; position:relative; box-shadow:0 0 0 9999px rgba(0,0,0,0.55); border-radius:20px; }
#fb { position:absolute; inset:0; border:2.5px solid rgba(255,255,255,0.9); border-radius:20px; }
.c { position:absolute; width:30px; height:30px; border-color:#4361ee; border-style:solid; }
.tl{top:-3px;left:-3px;border-width:5px 0 0 5px;border-radius:16px 0 0 0}
.tr{top:-3px;right:-3px;border-width:5px 5px 0 0;border-radius:0 16px 0 0}
.bl{bottom:-3px;left:-3px;border-width:0 0 5px 5px;border-radius:0 0 0 16px}
.br{bottom:-3px;right:-3px;border-width:0 5px 5px 0;border-radius:0 0 16px 0}
/* 掃描線動畫 */
#scanline { position:absolute; left:8px; right:8px; height:2px; background:linear-gradient(90deg,transparent,#4361ee,#7209b7,transparent); border-radius:2px; animation:sweep 2s ease-in-out infinite; }
@keyframes sweep { 0%{top:8px} 50%{top:calc(100% - 10px)} 100%{top:8px} }
#topbar { position:absolute; top:0; left:0; right:0; background:linear-gradient(180deg,rgba(0,0,0,0.75),transparent); padding:14px 16px 28px; display:flex; justify-content:space-between; align-items:center; }
#st { color:rgba(255,255,255,0.9); font-size:14px; font-weight:600; }
#sc { display:none; background:rgba(255,255,255,0.2); color:white; font-size:13px; font-weight:700; padding:5px 14px; border-radius:20px; }
#guide { position:absolute; bottom:110px; left:0; width:100%; text-align:center; color:white; font-size:14px; font-weight:500; text-shadow:0 1px 4px rgba(0,0,0,0.8); pointer-events:none; }
#sov { display:none; position:absolute; inset:0; align-items:center; justify-content:center; z-index:50; }
#sbox { background:rgba(5,150,105,0.96); color:white; padding:28px 36px; border-radius:20px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.5); max-width:280px; }
#sicon { font-size:52px; margin-bottom:10px; }
#stitle { font-size:20px; font-weight:800; margin-bottom:8px; }
#stext { font-size:13px; opacity:.9; word-break:break-all; line-height:1.5; }
#bottom { padding:14px 20px 28px; background:rgba(0,0,0,0.88); display:flex; justify-content:center; }
#cbtn { flex:1; max-width:220px; padding:15px; background:linear-gradient(135deg,#059669,#10b981); color:white; border:none; border-radius:30px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(5,150,105,0.4); }
#notice { display:none; position:absolute; top:70px; left:12px; right:12px; padding:14px 16px; border-radius:12px; font-size:13px; line-height:1.6; text-align:center; z-index:60; color:white; }
.err{background:rgba(239,68,68,0.95)} .warn{background:rgba(234,179,8,0.95);color:#1c1917}
#startBtnContainer { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; z-index:100; background:rgba(0,0,0,0.6); }
#startBtn { padding:18px 36px; background:linear-gradient(135deg,#4361ee,#7209b7); color:white; border:none; border-radius:40px; font-size:20px; font-weight:800; cursor:pointer; box-shadow:0 8px 20px rgba(67,97,238,0.5); }
#startBtn:active { transform:scale(0.96); }
</style>
</head>
<body>
<div id="vw">
  <video id="video" muted autoplay playsinline></video>
  <div id="overlay">
    <div id="frame">
      <div id="fb"></div>
      <div class="c tl"></div><div class="c tr"></div>
      <div class="c bl"></div><div class="c br"></div>
      <div id="scanline"></div>
    </div>
  </div>
  <div id="topbar"><div id="st">✅ 準備就緒</div><div id="sc"></div></div>
  <div id="guide">將 QR Code 對準框內即可自動辨識</div>
  <div id="sov"><div id="sbox"><div id="sicon">✅</div><div id="stitle">掃描成功！</div><div id="stext"></div></div></div>
  <div id="notice"></div>
  <div id="startBtnContainer">
    <button id="startBtn">📷 開始掃描</button>
  </div>
</div>
<div id="bottom"><button id="cbtn" onclick="finish()">✓ 完成掃描</button></div>

<script>
var params    = new URLSearchParams(location.search);
var maxRows   = parseInt(params.get('max') || '10');
var returnUrl = params.get('returnUrl') || '';

var stateRaw = null;
try { stateRaw = JSON.parse(localStorage.getItem('wh_scan_state')); } catch(e){}
var startRow = (stateRaw && stateRaw.startRow != null) ? stateRaw.startRow : 0;

var st    = document.getElementById('st');
var sc    = document.getElementById('sc');
var sov   = document.getElementById('sov');
var stxt  = document.getElementById('stext');
var ntc   = document.getElementById('notice');
var videoEl = document.getElementById('video');

var scanned = [];
var locked  = false;
var stream  = null;
var reader  = null;

function note(msg, cls) { ntc.textContent=msg; ntc.className=cls; ntc.style.display='block'; }

// ── 載入 ZXing ──
function loadZXing(cb) {
  st.textContent = '⏳ 載入掃描函式庫...';
  var cdns = [
    'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.4/umd/index.min.js',
    'https://unpkg.com/@zxing/browser@0.1.4/umd/index.min.js',
    'https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js',
    'https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js'
  ];
  var idx = 0;
  function next() {
    if (idx >= cdns.length) {
      note('❌ 所有 CDN 均失敗，請確認網路連線後重新整理', 'err');
      st.textContent = '❌ 載入失敗'; return;
    }
    var s = document.createElement('script');
    s.src = cdns[idx++];
    s.onload = function() {
      if (typeof ZXing !== 'undefined') { ntc.style.display='none'; cb(); }
      else next();
    };
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
}

// ── 啟動相機 + ZXing decodeFromStream ──
async function startScanner() {
  st.textContent = '⏳ 相機啟動中...';
  locked = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }
    });
    videoEl.srcObject = stream;
    await videoEl.play();

    reader = ZXing.BrowserMultiFormatReader
      ? new ZXing.BrowserMultiFormatReader()
      : new ZXing.BrowserQRCodeReader();

    st.textContent = '📷 對準 QR Code 即可自動辨識';

    reader.decodeFromStream(stream, videoEl, function(result, err) {
      if (result && !locked) {
        onScan(result.getText());
      }
      // NotFoundException = 正常，忽略
    });

  } catch(e) {
    var msgs = {
      NotAllowedError:  '❌ 請允許相機權限後重新整理',
      NotFoundError:    '❌ 找不到相機',
      NotReadableError: '❌ 相機被其他 App 佔用'
    };
    note(msgs[e.name]||('❌ '+(e.message||e.name)), 'err');
    st.textContent = '❌ 相機啟動失敗';
  }
}

function onScan(text) {
  if (locked) return;
  locked = true;

  // 避免連掃同一碼
  if (scanned.length && scanned[scanned.length-1] === text) {
    locked = false;
    return;
  }

  scanned.push(text);
  sc.style.display = 'block';
  sc.textContent   = '已掃 ' + scanned.length + ' / ' + maxRows;
  stxt.textContent = '第 ' + (startRow + scanned.length) + ' 列：' + text;
  sov.style.display = 'flex';
  st.textContent   = '✅ 第 ' + scanned.length + ' 筆完成';

  try {
    if (window.opener) window.opener.postMessage({ type:'QR_SCAN_RESULT', text:text, index:scanned.length-1 }, '*');
  } catch(e) {}

  try {
    localStorage.setItem('wh_scan_results', JSON.stringify({ startRow:startRow, results:scanned.slice(), ts:Date.now() }));
  } catch(e) {}

  setTimeout(function() {
    sov.style.display = 'none';
    if (scanned.length >= maxRows) {
      finish();
    } else {
      st.textContent = '📷 繼續對準下一個 QR Code';
      locked = false;
    }
  }, 1500);
}

// ── 開始按鈕 ──
document.getElementById('startBtn').addEventListener('click', function() {
  document.getElementById('startBtnContainer').style.display = 'none';
  loadZXing(startScanner);
});

// ── 完成掃描 ──
function finish() {
  if (reader) { try { reader.reset(); } catch(e){} }
  if (stream) stream.getTracks().forEach(function(t){ t.stop(); });

  try {
    localStorage.setItem('wh_scan_results', JSON.stringify({ startRow:startRow, results:scanned.slice(), ts:Date.now() }));
  } catch(e) {}

  try {
    if (window.opener) {
      window.opener.postMessage({ type:'QR_SCAN_DONE', results:scanned.slice(), startRow:startRow, total:scanned.length }, '*');
      setTimeout(function(){ window.close(); }, 200);
      return;
    }
  } catch(e) {}

  if (returnUrl) { window.location.href = returnUrl; return; }

  setTimeout(function() {
    window.close();
    setTimeout(function() {
      if (!window.closed) {
        var btn = document.getElementById('cbtn');
        btn.textContent = '✅ 掃描完成，請手動關閉此頁';
        btn.style.background = '#64748b';
      }
    }, 500);
  }, 150);
}
</script>
</body>
</html>
