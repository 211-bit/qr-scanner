<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QR Code 掃描器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; flex-direction:column; height:100dvh; overflow:hidden; font-family:'PingFang TC','Microsoft JhengHei',sans-serif; }
#vw { flex:1; position:relative; overflow:hidden; }
#video { width:100%; height:100%; object-fit:cover; display:block; }
#overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
#frame { width:240px; height:240px; position:relative; box-shadow:0 0 0 9999px rgba(0,0,0,0.52); border-radius:16px; }
#fb { position:absolute; inset:0; border:2.5px solid rgba(255,255,255,0.85); border-radius:16px; }
.c { position:absolute; width:26px; height:26px; border-color:#4361ee; border-style:solid; }
.tl{top:-3px;left:-3px;border-width:4px 0 0 4px;border-radius:14px 0 0 0}
.tr{top:-3px;right:-3px;border-width:4px 4px 0 0;border-radius:0 14px 0 0}
.bl{bottom:-3px;left:-3px;border-width:0 0 4px 4px;border-radius:0 0 0 14px}
.br{bottom:-3px;right:-3px;border-width:0 4px 4px 0;border-radius:0 0 14px 0}
#topbar { position:absolute; top:0; left:0; right:0; background:linear-gradient(180deg,rgba(0,0,0,0.75),transparent); padding:14px 16px 28px; display:flex; justify-content:space-between; align-items:center; }
#st { color:rgba(255,255,255,0.9); font-size:14px; font-weight:600; }
#sc { display:none; background:rgba(255,255,255,0.2); color:white; font-size:13px; font-weight:700; padding:5px 14px; border-radius:20px; }
#guide { position:absolute; bottom:110px; left:0; width:100%; text-align:center; color:white; font-size:14px; font-weight:500; text-shadow:0 1px 4px rgba(0,0,0,0.8); pointer-events:none; }
#sov { display:none; position:absolute; inset:0; align-items:center; justify-content:center; z-index:50; }
#sbox { background:rgba(5,150,105,0.96); color:white; padding:28px 36px; border-radius:20px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.5); max-width:280px; }
#sicon { font-size:52px; margin-bottom:10px; }
#stitle { font-size:20px; font-weight:800; margin-bottom:8px; }
#stext { font-size:13px; opacity:.9; word-break:break-all; line-height:1.5; }
#bottom { padding:14px 20px 28px; background:rgba(0,0,0,0.88); display:flex; justify-content:center; }
#cbtn { flex:1; max-width:220px; padding:15px; background:linear-gradient(135deg,#059669,#10b981); color:white; border:none; border-radius:30px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(5,150,105,0.4); }
#notice { display:none; position:absolute; top:70px; left:12px; right:12px; padding:14px 16px; border-radius:12px; font-size:13px; line-height:1.6; text-align:center; z-index:60; color:white; }
.err{background:rgba(239,68,68,0.95)} .warn{background:rgba(234,179,8,0.95);color:#1c1917}
</style>
</head>
<body>
<div id="vw">
  <video id="video" muted autoplay playsinline></video>
  <div id="overlay"><div id="frame"><div id="fb"></div><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div></div></div>
  <div id="topbar"><div id="st">⏳ 載入中...</div><div id="sc"></div></div>
  <div id="guide">將 QR Code 對準框內即可自動辨識</div>
  <div id="sov"><div id="sbox"><div id="sicon">✅</div><div id="stitle">掃描成功！</div><div id="stext"></div></div></div>
  <div id="notice"></div>
</div>
<div id="bottom"><button id="cbtn" onclick="finish()">✓ 完成掃描</button></div>

<script>
// ── URL 參數 ──
var params    = new URLSearchParams(location.search);
var maxRows   = parseInt(params.get('max') || '10');
var returnUrl = params.get('returnUrl') || '';
var originUrl = params.get('origin') || '*';  // 相容舊版 postMessage

// 從 localStorage 讀起始列
var stateRaw = null;
try { stateRaw = JSON.parse(localStorage.getItem('wh_scan_state')); } catch(e){}
var startRow = (stateRaw && stateRaw.startRow != null) ? stateRaw.startRow : 0;

// DOM
var st   = document.getElementById('st');
var sc   = document.getElementById('sc');
var sov  = document.getElementById('sov');
var stxt = document.getElementById('stext');
var ntc  = document.getElementById('notice');

var scanned  = [];
var locked   = false;
var videoEl  = document.getElementById('video');

function note(msg, cls) { ntc.textContent=msg; ntc.className=cls; ntc.style.display='block'; }

// ── 載入 ZXing ──
function loadZXing(cb) {
  st.textContent = '⏳ 載入掃描函式庫...';

  function tryLoad(src, ok, fail) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function() { typeof ZXing !== 'undefined' ? ok() : fail(); };
    s.onerror = fail;
    document.head.appendChild(s);
  }

  // 嘗試多個 CDN
  var cdns = [
    'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.4/umd/index.min.js',
    'https://unpkg.com/@zxing/browser@0.1.4/umd/index.min.js',
    'https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js',
    'https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js'
  ];
  var idx = 0;

  function next() {
    if (idx >= cdns.length) {
      note('❌ 所有 CDN 均失敗，請確認網路連線後重新整理', 'err');
      st.textContent = '❌ 載入失敗';
      return;
    }
    var src = cdns[idx++];
    tryLoad(src, function() {
      ntc.style.display = 'none';
      cb();
    }, function() {
      note('CDN ' + idx + ' 失敗，嘗試下一個...', 'warn');
      next();
    });
  }
  next();
}

// ── 偵測裝置 ──
var isSamsung = /Samsung/i.test(navigator.userAgent) || /SamsungBrowser/i.test(navigator.userAgent);
var isIOS     = /iP(hone|ad|od)/.test(navigator.userAgent);

// ── 啟動相機 + ZXing（三星相容版）──
var activeStream   = null;   // 記錄 stream 供 finish() 停止
var scanIntervalId = null;   // canvas 輪詢計時器（三星備援）
var zxingReader    = null;

async function startScanner() {
  st.textContent = '⏳ 相機啟動中...';
  locked = false;

  // 三星優先用寬鬆的 constraints，避免解析度不支援卡住
  var constraints = isSamsung
    ? { audio: false, video: { facingMode: 'environment' } }
    : { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } };

  try {
    activeStream = await navigator.mediaDevices.getUserMedia(constraints);
    videoEl.srcObject = activeStream;

    // 三星 Samsung Internet 需要設定這些屬性才能 autoplay
    videoEl.setAttribute('playsinline', true);
    videoEl.setAttribute('muted', true);
    videoEl.muted = true;

    await videoEl.play().catch(function(playErr) {
      // 部分三星版本 play() 會 reject，但其實已在播放，忽略即可
      console.warn('play() warning:', playErr);
    });

    // ZXing reader
    var hints = new Map();
    if (ZXing.BrowserMultiFormatReader) {
      zxingReader = new ZXing.BrowserMultiFormatReader(hints);
    } else if (ZXing.BrowserQRCodeReader) {
      zxingReader = new ZXing.BrowserQRCodeReader(hints);
    } else {
      throw new Error('找不到 ZXing Reader');
    }

    st.textContent = '📷 對準 QR Code 即可自動辨識';

    // ── 主解碼方式：decodeFromStream ──
    var streamDecodeOk = false;
    try {
      zxingReader.decodeFromStream(activeStream, videoEl, function(result, err, controls) {
        streamDecodeOk = true;
        if (result && !locked) {
          locked = true;
          var text = result.getText();
          if (scanned.length && scanned[scanned.length-1] === text) { locked = false; return; }
          _onScanned(text, controls);
        }
      });
    } catch(streamErr) {
      console.warn('decodeFromStream failed, fallback to canvas polling:', streamErr);
    }

    // ── 備援：canvas 輪詢（三星 Samsung Internet 有時 decodeFromStream 無回調）──
    setTimeout(function() {
      if (!streamDecodeOk) {
        console.log('Activating canvas polling fallback for Samsung');
        _startCanvasPolling();
      }
    }, 2000);

  } catch(e) {
    if (e.name === 'NotAllowedError') {
      showCameraBlockedGuide();
    } else {
      var msgs = {
        NotFoundError:    '❌ 找不到相機，請確認裝置有相機',
        NotReadableError: '❌ 相機被其他 App 佔用，請關閉後再試'
      };
      note(msgs[e.name] || ('❌ ' + (e.message || e.name)), 'err');
      st.textContent = '❌ 相機啟動失敗';
    }
  }
}

// ── Canvas 輪詢備援（每 300ms 抓一幀解碼，給三星用）──
function _startCanvasPolling() {
  if (scanIntervalId) return;
  var canvas  = document.createElement('canvas');
  var ctx     = canvas.getContext('2d');
  var polling = new ZXing.BrowserMultiFormatReader
    ? new ZXing.BrowserMultiFormatReader()
    : new ZXing.BrowserQRCodeReader();

  scanIntervalId = setInterval(function() {
    if (locked || videoEl.readyState < 2) return;
    try {
      canvas.width  = videoEl.videoWidth  || 640;
      canvas.height = videoEl.videoHeight || 480;
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var luminance = new ZXing.RGBLuminanceSource
        ? new ZXing.RGBLuminanceSource(imgData.data, canvas.width, canvas.height)
        : null;

      if (!luminance) {
        // 用 decodeFromImageElement 備援
        polling.decodeFromCanvas(canvas).then(function(result) {
          if (result && !locked) {
            locked = true;
            var text = result.getText();
            if (scanned.length && scanned[scanned.length-1] === text) { locked = false; return; }
            _onScanned(text, null);
          }
        }).catch(function(){});
      } else {
        var bmp    = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminance));
        var result = polling.decode(bmp);
        if (result && !locked) {
          locked = true;
          var text = result.getText();
          if (scanned.length && scanned[scanned.length-1] === text) { locked = false; return; }
          _onScanned(text, null);
        }
      }
    } catch(e) { /* NotFoundException 是正常的，忽略 */ }
  }, 300);
}

// ── 掃描成功共用處理 ──
function _onScanned(text, controls) {
  scanned.push(text);
  sc.style.display = 'block';
  sc.textContent   = '已掃 ' + scanned.length + ' / ' + maxRows;
  stxt.textContent = '第 ' + (startRow + scanned.length) + ' 列：' + text;
  sov.style.display = 'flex';
  st.textContent   = '✅ 第 ' + scanned.length + ' 筆完成';

  try {
    if (window.opener) {
      window.opener.postMessage({ type:'QR_SCAN_RESULT', text:text, index:scanned.length-1 }, '*');
    }
  } catch(e) {}

  try {
    localStorage.setItem('wh_scan_results', JSON.stringify({
      startRow: startRow, results: scanned.slice(), ts: Date.now()
    }));
  } catch(e) {}

  setTimeout(function() {
    sov.style.display = 'none';
    if (scanned.length >= maxRows) {
      if (controls) try { controls.stop(); } catch(e) {}
      if (scanIntervalId) { clearInterval(scanIntervalId); scanIntervalId = null; }
      finish();
    } else {
      st.textContent = '📷 繼續對準下一個 QR Code';
      locked = false;
    }
  }, 1500);
}

// ── 相機被拒絕時顯示引導解鎖畫面 ──
function showCameraBlockedGuide() {
  st.textContent = '❌ 相機權限被封鎖';
  var isSamsungBrowser = /SamsungBrowser/i.test(navigator.userAgent);
  var steps = isIOS
    ? ['① 關閉此頁面',
       '② 開啟「設定」App',
       '③ 找到「Safari」',
       '④ 點「相機」→ 改為「允許」',
       '⑤ 重新開啟掃描']
    : isSamsungBrowser
    ? ['① 點網址列右側 ⋮ 選單',
       '② 選「設定」→「網站權限」',
       '③ 找到「相機」→ 解除封鎖',
       '④ 或：長按網址列 → 點「網站設定」→ 相機改允許',
       '⑤ 重新整理頁面']
    : ['① 點下方「重新請求」按鈕',
       '　 若跳出確認框 → 選「允許」',
       '② 若無跳出，點網址列左側 🔒',
       '③ 找「相機」→ 改為「允許」',
       '④ 重新整理頁面即可'];

  videoEl.style.display = 'none';
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('guide').style.display   = 'none';
  document.getElementById('bottom').style.display  = 'none';

  var guide = document.createElement('div');
  guide.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e293b;padding:28px;z-index:999;';
  guide.innerHTML = [
    '<div style="font-size:64px;margin-bottom:16px;">📷</div>',
    '<div style="font-size:20px;font-weight:800;color:white;margin-bottom:8px;text-align:center;">相機權限被封鎖</div>',
    '<div style="font-size:13px;color:#94a3b8;margin-bottom:24px;text-align:center;line-height:1.6;">請依照以下步驟重新開啟相機權限：</div>',
    '<div style="width:100%;max-width:320px;background:#0f172a;border-radius:16px;padding:20px;margin-bottom:24px;">',
      steps.map(function(s){
        return '<div style="font-size:13px;color:#e2e8f0;padding:7px 0;border-bottom:1px solid #1e293b;line-height:1.6;">' + s + '</div>';
      }).join(''),
    '</div>',
    (!isIOS ? '<button id="retry-cam-btn" style="width:100%;max-width:320px;padding:15px;background:linear-gradient(135deg,#4361ee,#7209b7);color:white;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;box-shadow:0 4px 12px rgba(67,97,238,0.4);">🔄 重新請求相機權限</button>' : ''),
    '<button onclick="window.close()" style="width:100%;max-width:320px;padding:13px;background:#334155;color:#94a3b8;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;">關閉此頁</button>'
  ].join('');

  document.getElementById('vw').appendChild(guide);

  var retryBtn = document.getElementById('retry-cam-btn');
  if (retryBtn) {
    retryBtn.addEventListener('click', function() {
      retryBtn.textContent = '⏳ 請求中...';
      retryBtn.disabled = true;
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          stream.getTracks().forEach(function(t){ t.stop(); });
          guide.remove();
          videoEl.style.display = 'block';
          document.getElementById('overlay').style.display = 'flex';
          document.getElementById('guide').style.display   = 'block';
          document.getElementById('bottom').style.display  = 'flex';
          startScanner();
        })
        .catch(function() {
          retryBtn.textContent = '❌ 仍被拒絕，請至設定手動開啟';
          retryBtn.style.background = '#475569';
          retryBtn.disabled = false;
        });
    });
  }
}

// ── 完成掃描 ──
function finish() {
  // 停止相機（用 activeStream 確保三星也能正確停止）
  try {
    if (activeStream) {
      activeStream.getTracks().forEach(function(t){ t.stop(); });
      activeStream = null;
    } else if (videoEl.srcObject) {
      videoEl.srcObject.getTracks().forEach(function(t){ t.stop(); });
    }
  } catch(e) {}

  // 停止 canvas 輪詢
  if (scanIntervalId) { clearInterval(scanIntervalId); scanIntervalId = null; }

  // 確保最終結果已存到 localStorage
  try {
    localStorage.setItem('wh_scan_results', JSON.stringify({
      startRow: startRow,
      results:  scanned.slice(),
      ts:       Date.now()
    }));
  } catch(e) {}

  // 通知 opener
  try {
    if (window.opener) {
      window.opener.postMessage({
        type: 'QR_SCAN_DONE', results: scanned.slice(), startRow: startRow, total: scanned.length
      }, '*');
    }
  } catch(e) {}

  // ✅ 直接關閉此分頁，不跳轉
  setTimeout(function() {
    window.close();
    setTimeout(function() {
      if (!window.closed) {
        document.getElementById('cbtn').textContent = '✅ 掃描完成，請手動關閉此頁';
        document.getElementById('cbtn').style.background = '#64748b';
        document.getElementById('cbtn').onclick = function(){ window.close(); };
      }
    }, 500);
  }, 150);
}

// ── 入口 ──
loadZXing(startScanner);
</script>
</body>
</html>
